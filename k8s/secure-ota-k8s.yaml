apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-ota
  labels:
    app: secure-ota
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-ota
  template:
    metadata:
      labels:
        app: secure-ota
    spec:
      containers:
        - name: secure-ota
          image: secure-ota-hash-validator:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: secure-ota-service
spec:
  selector:
    app: secure-ota
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
